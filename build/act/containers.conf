# Container configuration override for the act CI runner's podman service.
#
# act creates its job container through this service without --security-opt,
# and the job (kind, podman-based test steps) must connect back to this
# service's socket. SELinux container separation blocks that connect, so
# containers created through this service run unlabeled — matching the
# no-SELinux environment of GitHub-hosted runners.
[containers]
label = false
